<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CA Fee Tracker</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:#0d1b2a; --navy-2:#112236; --navy-3:#162d47; --navy-4:#1d3a57;
    --gold:#c9a84c; --gold-light:#e8c97a; --gold-dim:#7a6030;
    --text-1:#e8edf5; --text-2:#a8b4c8; --text-3:#6a7a90;
    --border:rgba(201,168,76,0.15); --border-2:rgba(201,168,76,0.08);
    --shadow:0 8px 32px rgba(0,0,0,0.4); --radius:10px; --radius-lg:16px;
  }
  body { background:var(--navy); font-family:'DM Sans',sans-serif; color:var(--text-1); }
  .app { display:flex; height:100vh; overflow:hidden; }

  .sidebar { width:240px; min-width:240px; background:var(--navy-2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sidebar-brand { padding:24px 20px 20px; border-bottom:1px solid var(--border); }
  .brand-badge { display:inline-block; background:var(--gold); color:var(--navy); font-family:'DM Mono',monospace; font-size:9px; font-weight:500; letter-spacing:2px; padding:3px 8px; border-radius:4px; margin-bottom:8px; }
  .brand-title { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--text-1); line-height:1.2; }
  .brand-sub { font-size:11px; color:var(--text-3); margin-top:3px; }
  .sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
  .nav-section { margin-bottom:20px; }
  .nav-section-label { font-size:9px; letter-spacing:2px; color:var(--text-3); text-transform:uppercase; padding:0 8px 8px; font-weight:600; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius); cursor:pointer; transition:all 0.2s; color:var(--text-2); font-size:13.5px; border:1px solid transparent; margin-bottom:2px; }
  .nav-item:hover { background:var(--navy-3); color:var(--text-1); }
  .nav-item.active { background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(201,168,76,0.05)); color:var(--gold-light); border-color:var(--border); }
  .nav-item.active svg { stroke:var(--gold); }
  .sidebar-footer { padding:16px 12px; border-top:1px solid var(--border); }
  .role-badge { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--navy-3); border-radius:var(--radius); margin-bottom:8px; }
  .role-dot { width:8px; height:8px; border-radius:50%; background:var(--gold); }
  .role-name { font-size:12px; color:var(--text-1); font-weight:500; }
  .role-label { font-size:10px; color:var(--text-3); }
  .btn-logout { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:9px; border:1px solid var(--border); border-radius:var(--radius); background:transparent; color:var(--text-3); font-size:12px; cursor:pointer; transition:all 0.2s; font-family:'DM Sans',sans-serif; }
  .btn-logout:hover { background:rgba(255,80,80,0.1); color:#ff7b7b; border-color:rgba(255,80,80,0.3); }

  /* Sync status bar */
  .sync-bar { display:flex; align-items:center; gap:8px; padding:7px 18px; font-size:11px; border-bottom:1px solid var(--border-2); }
  .sync-bar.syncing  { background:rgba(201,168,76,0.06); color:var(--gold-light); }
  .sync-bar.ok       { background:rgba(0,204,102,0.05);  color:#66ffaa; }
  .sync-bar.error    { background:rgba(255,68,68,0.08);  color:#ff7b7b; }
  .sync-bar.loading  { background:rgba(100,100,200,0.06);color:#9999ff; }
  .sync-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .sync-dot.syncing  { background:var(--gold); animation:pulse 1s infinite; }
  .sync-dot.ok       { background:#00cc66; }
  .sync-dot.error    { background:#ff4444; }
  .sync-dot.loading  { background:#9999ff; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .sync-retry { margin-left:auto; cursor:pointer; text-decoration:underline; font-size:11px; }

  /* Client Master */
  .master-search-bar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .master-count-badge { background:var(--navy-3); border:1px solid var(--border-2); border-radius:6px; padding:4px 12px; font-size:11px; color:var(--text-3); white-space:nowrap; }
  .master-card { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); margin-bottom:12px; overflow:hidden; transition:border-color 0.2s; }
  .master-card:hover { border-color:var(--border); }
  .master-card-header { display:grid; grid-template-columns:2fr 1.2fr 1fr 1fr auto; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; }
  .master-card-name { font-weight:600; font-size:14px; color:var(--text-1); }
  .master-card-pan  { font-family:"DM Mono",monospace; font-size:12px; color:var(--gold-light); letter-spacing:0.5px; }
  .master-card-mobile { font-size:12px; color:var(--text-3); }
  .master-card-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .master-ay-chip { background:var(--navy-3); border:1px solid var(--border-2); border-radius:4px; font-size:10px; color:var(--text-3); padding:2px 7px; white-space:nowrap; }
  .master-expand-btn { background:none; border:none; color:var(--text-3); cursor:pointer; padding:4px; border-radius:4px; transition:color 0.2s; }
  .master-expand-btn:hover { color:var(--text-1); }
  .master-history { border-top:1px solid var(--border-2); overflow:hidden; }
  .master-history table { width:100%; }
  .master-history th { background:var(--navy-3); }
  .master-summary-row { display:flex; gap:16px; padding:8px 18px; background:rgba(201,168,76,0.04); border-top:1px solid var(--border-2); font-size:11px; color:var(--text-3); }
  .master-summary-item strong { color:var(--text-2); }
  .master-empty { text-align:center; padding:60px 20px; color:var(--text-3); }
  .master-stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .master-stat { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); padding:14px 18px; }
  .master-stat-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .master-stat-value { font-family:"Playfair Display",serif; font-size:22px; color:var(--text-1); }
  .master-stat-sub { font-size:10px; color:var(--text-3); margin-top:2px; }

  /* Backup system */
  .backup-bar { background:linear-gradient(90deg,rgba(201,168,76,0.12),rgba(201,168,76,0.04)); border-bottom:1px solid rgba(201,168,76,0.25); padding:10px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; color:var(--gold-light); animation:fadeIn 0.3s ease; }
  .backup-bar-warn { background:linear-gradient(90deg,rgba(255,120,0,0.12),rgba(255,120,0,0.04)); border-bottom:1px solid rgba(255,120,0,0.3); color:#ffaa55; }
  .backup-bar-left { display:flex; align-items:center; gap:8px; }
  .backup-bar-actions { display:flex; gap:8px; }
  .btn-backup { display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:6px; font-size:11px; font-weight:500; cursor:pointer; border:1px solid; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .btn-backup-primary { background:rgba(201,168,76,0.15); border-color:rgba(201,168,76,0.4); color:var(--gold-light); }
  .btn-backup-primary:hover { background:rgba(201,168,76,0.25); }
  .btn-backup-ghost { background:transparent; border-color:rgba(201,168,76,0.2); color:var(--text-3); }
  .btn-backup-ghost:hover { color:var(--text-1); border-color:rgba(201,168,76,0.4); }
  .backup-sidebar { padding:12px; border-top:1px solid var(--border-2); margin-top:4px; }
  .backup-sidebar-title { font-size:9px; letter-spacing:2px; color:var(--text-3); text-transform:uppercase; margin-bottom:8px; padding:0 4px; font-weight:600; }
  .btn-backup-side { width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius); font-size:12px; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text-2); font-family:'DM Sans',sans-serif; transition:all 0.2s; margin-bottom:4px; }
  .btn-backup-side:hover { background:var(--navy-3); color:var(--text-1); border-color:var(--border); }
  .btn-backup-side.restore { color:#88cc88; border-color:rgba(68,102,68,0.4); }
  .btn-backup-side.restore:hover { background:rgba(68,102,68,0.15); }
  .last-backup-note { font-size:10px; color:var(--text-3); padding:4px 4px 0; text-align:center; }

  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { padding:16px 28px; border-bottom:1px solid var(--border-2); background:var(--navy-2); display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .topbar-title { font-family:'Playfair Display',serif; font-size:20px; color:var(--text-1); }
  .topbar-sub { font-size:12px; color:var(--text-3); margin-top:1px; }
  .topbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .ay-badge { background:rgba(201,168,76,0.12); border:1px solid var(--border); color:var(--gold-light); font-size:12px; padding:5px 12px; border-radius:20px; font-family:'DM Mono',monospace; }
  .content { flex:1; overflow-y:auto; padding:24px 28px; }

  .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .stat-card { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); padding:18px 20px; position:relative; overflow:hidden; transition:background 0.2s, transform 0.15s; }
  .stat-card:hover { background:var(--navy-3); transform:translateY(-2px); }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .stat-card.gold::before { background:linear-gradient(90deg,var(--gold),transparent); }
  .stat-card.green::before { background:linear-gradient(90deg,#00cc66,transparent); }
  .stat-card.orange::before { background:linear-gradient(90deg,#ffaa00,transparent); }
  .stat-label { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .stat-value { font-family:'Playfair Display',serif; font-size:26px; color:var(--text-1); }
  .stat-sub { font-size:11px; color:var(--text-3); margin-top:4px; }
  .stat-icon { position:absolute; right:16px; top:50%; transform:translateY(-50%); opacity:0.12; }
  .stat-card[style*="cursor:pointer"]:hover,.stat-card[style*="cursor: pointer"]:hover { background:var(--navy-3); transform:translateY(-1px); box-shadow:0 4px 20px rgba(201,168,76,0.1); transition:all 0.2s; }
  .assoc-stat[style*="cursor:pointer"]:hover,.assoc-stat[style*="cursor: pointer"]:hover { background:var(--navy-3); transform:translateY(-1px); transition:all 0.2s; }

  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .search-box { display:flex; align-items:center; gap:8px; background:var(--navy-2); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; flex:1; min-width:200px; }
  .search-box input { background:none; border:none; outline:none; color:var(--text-1); font-size:13px; width:100%; font-family:'DM Sans',sans-serif; }
  .search-box input::placeholder { color:var(--text-3); }
  .filter-select { background:var(--navy-2); border:1px solid var(--border); color:var(--text-1); border-radius:var(--radius); padding:8px 12px; font-size:13px; font-family:'DM Sans',sans-serif; cursor:pointer; outline:none; }
  .filter-select option { background:var(--navy-2); }
  .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:var(--radius); font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all 0.2s; font-family:'DM Sans',sans-serif; white-space:nowrap; }
  .btn-primary { background:var(--gold); color:var(--navy); }
  .btn-primary:hover { background:var(--gold-light); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-2); }
  .btn-outline:hover { background:var(--navy-3); color:var(--text-1); }
  .btn-sm { padding:6px 12px; font-size:12px; }
  .btn-icon { padding:7px; }

  .table-wrap { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { padding:12px 16px; text-align:left; font-size:10.5px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:1.2px; background:var(--navy-3); border-bottom:1px solid var(--border); }
  tbody tr { border-bottom:1px solid var(--border-2); transition:background 0.15s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:rgba(255,255,255,0.02); }
  tbody td { padding:11px 16px; font-size:13px; color:var(--text-2); vertical-align:middle; }
  .td-name { color:var(--text-1); font-weight:500; }
  .td-pan { font-family:'DM Mono',monospace; font-size:12px; color:var(--gold-dim); }
  .td-amount { font-family:'DM Mono',monospace; font-size:13px; }
  .status-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; }
  .status-dot { width:6px; height:6px; border-radius:50%; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:var(--navy-2); border:1px solid var(--border); border-radius:var(--radius-lg); width:100%; max-width:600px; box-shadow:var(--shadow); max-height:92vh; overflow-y:auto; }
  .modal-header { padding:20px 24px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .modal-title { font-family:'Playfair Display',serif; font-size:18px; }
  .modal-body { padding:20px 24px; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group.full { grid-column:1/-1; }
  .form-label { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
  .opt-tag { font-size:9px; color:var(--text-3); font-weight:400; text-transform:none; letter-spacing:0; margin-left:5px; background:var(--navy-3); padding:1px 5px; border-radius:3px; }
  .form-input,.form-select,.form-textarea { background:var(--navy-3); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; color:var(--text-1); font-size:13px; outline:none; transition:border-color 0.2s; font-family:'DM Sans',sans-serif; }
  .form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--gold-dim); }
  .form-select option { background:var(--navy-3); }
  .form-textarea { resize:vertical; min-height:60px; }
  .form-divider { grid-column:1/-1; border:none; border-top:1px solid var(--border); margin:4px 0; }
  .form-section-label { grid-column:1/-1; font-size:10px; letter-spacing:2px; color:var(--gold-dim); text-transform:uppercase; font-weight:600; }
  .dup-warning { grid-column:1/-1; background:rgba(255,170,0,0.1); border:1px solid rgba(255,170,0,0.35); border-radius:var(--radius); padding:10px 14px; font-size:12px; color:#ffcc66; display:flex; align-items:center; gap:8px; }

  .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--navy); background-image:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,0.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(29,58,87,0.6) 0%,transparent 60%); }
  .login-card { background:var(--navy-2); border:1px solid var(--border); border-radius:20px; padding:40px; width:100%; max-width:420px; box-shadow:var(--shadow); }
  .login-logo { text-align:center; margin-bottom:28px; }
  .login-logo-badge { display:inline-block; background:var(--gold); color:var(--navy); font-family:'DM Mono',monospace; font-size:10px; letter-spacing:3px; padding:4px 12px; border-radius:6px; margin-bottom:12px; font-weight:500; }
  .login-logo-title { font-family:'Playfair Display',serif; font-size:24px; color:var(--text-1); line-height:1.2; }
  .login-logo-sub { font-size:12px; color:var(--text-3); margin-top:4px; }
  .login-role-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
  .role-tab { padding:12px; border-radius:var(--radius); border:1px solid var(--border); cursor:pointer; text-align:center; transition:all 0.2s; background:var(--navy-3); }
  .role-tab.active { background:rgba(201,168,76,0.15); border-color:var(--gold-dim); }
  .role-tab-name { font-size:13px; font-weight:500; color:var(--text-1); }
  .role-tab-desc { font-size:11px; color:var(--text-3); }
  .login-error { background:rgba(255,60,60,0.1); border:1px solid rgba(255,60,60,0.3); border-radius:var(--radius); padding:10px 14px; font-size:12px; color:#ff7b7b; margin-bottom:12px; }
  .login-hint { text-align:center; font-size:11px; color:var(--text-3); margin-top:12px; }

  .report-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .report-card { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); padding:20px; }
  .report-card-title { font-size:12px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .progress-bar-bg { background:var(--navy-3); border-radius:4px; height:6px; overflow:hidden; margin:8px 0; }
  .progress-bar-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 0.5s ease; }

  .db-panel { background:var(--navy-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; margin-bottom:20px; }
  .db-panel-title { font-family:'Playfair Display',serif; font-size:17px; margin-bottom:4px; }
  .db-panel-sub { font-size:12px; color:var(--text-3); margin-bottom:20px; }
  .db-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .db-note { background:rgba(201,168,76,0.06); border:1px solid rgba(201,168,76,0.15); border-radius:var(--radius); padding:12px 14px; font-size:12px; color:var(--text-3); margin-bottom:16px; line-height:1.6; }
  .db-note strong { color:var(--gold-light); }
  .import-msg-ok  { background:rgba(0,204,102,0.1); border:1px solid rgba(0,204,102,0.3); border-radius:var(--radius); padding:12px 16px; font-size:13px; color:#66ffaa; display:flex; align-items:center; gap:8px; margin-top:14px; }
  .import-msg-err { background:rgba(255,68,68,0.1); border:1px solid rgba(255,68,68,0.3); border-radius:var(--radius); padding:12px 16px; font-size:13px; color:#ff7b7b; display:flex; align-items:center; gap:8px; margin-top:14px; }

  .assoc-welcome { background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 24px; margin-bottom:24px; display:flex; align-items:center; gap:16px; }
  .assoc-welcome h2 { font-family:'Playfair Display',serif; font-size:18px; color:var(--text-1); margin-bottom:4px; }
  .assoc-welcome p { font-size:12px; color:var(--text-3); }
  .assoc-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .assoc-stat { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); padding:16px 18px; transition:background 0.2s, transform 0.15s; }
  .assoc-stat:hover { background:var(--navy-3); transform:translateY(-1px); }
  .assoc-stat-label { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .assoc-stat-value { font-family:'Playfair Display',serif; font-size:22px; color:var(--text-1); }
  .assoc-stat-sub { font-size:11px; color:var(--text-3); margin-top:3px; }

  /* Waived fee badge */
  .waived-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; background:#1a2a1a; color:#88cc88; border:1px dashed #446644; }
  .waived-row  { opacity:0.65; }

  /* ITR Filing status pills */
  .itr-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; white-space:nowrap; }
  .itr-filed   { background:#0a2e1a; color:#66ffaa; }
  .itr-unfiled { background:#1a1a3d; color:#9999ff; }

  /* Dual-progress overview block (ITR filing + fee collection) */
  .filing-overview { background:var(--navy-2); border:1px solid var(--border-2); border-radius:var(--radius-lg); padding:20px; margin-bottom:20px; }
  .filing-overview-title { font-size:12px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .filing-dual { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .filing-bar-label { font-size:11px; color:var(--text-3); margin-bottom:5px; display:flex; justify-content:space-between; }
  .filing-bar-label strong { color:var(--text-1); }
  .progress-itr  { height:100%; border-radius:4px; background:linear-gradient(90deg,#5555ff,#9999ff); transition:width 0.5s ease; }
  .progress-fee  { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 0.5s ease; }
  .filing-bar-sub { font-size:10px; color:var(--text-3); margin-top:3px; }
  .section-heading { margin:20px 0 10px; font-size:12px; color:var(--text-3); display:flex; align-items:center; gap:6px; }

  .scrollbar-thin::-webkit-scrollbar { width:4px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.3s ease forwards; }


/* Extra styles for vanilla JS version */
.hidden { display:none !important; }
.page { display:none; }
.page.active { display:block; }
select option { background:#112236; color:#e8edf5; }
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px; }
.opt-tag { font-size:9px;background:rgba(201,168,76,0.15);color:var(--gold-dim);padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:1px;text-transform:uppercase; }
</style>
</head>
<body>
<div class="app" id="app" style="display:none"></div>
<div id="login-screen"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SHEET_URL   = "https://script.google.com/macros/s/AKfycbwFzemtBdO9e1X_YAffGwGDhnpFSxgXpE7uuZDrzHCmMd2eaIJ4tSnlsp3txJbd29Nq/exec";
const CA_PASSWORD = "CA@2024";
const AY_LIST     = ["AY 2026-27","AY 2025-26","AY 2024-25","AY 2023-24","AY 2022-23"];
const ITR_FORMS   = ["ITR-1","ITR-2","ITR-3","ITR-4","ITR-5","ITR-6","ITR-7"];
const PAY_MODES   = ["UPI","Cash","Office Cash","NEFT/RTGS","Cheque","Other"];
const STATUS_COLORS = {
  Pending:  { bg:"#3d1a1a", text:"#ff7b7b", dot:"#ff4444" },
  Partial:  { bg:"#3d2e0a", text:"#ffcc66", dot:"#ffaa00" },
  Received: { bg:"#0a2e1a", text:"#66ffaa", dot:"#00cc66" },
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  role: null,       // "ca" | "associate"
  page: "home",
  clients: [],
  filterAY: "AY 2026-27",
  syncStatus: "loading",
  syncMsg: "Connecting to Google Sheets...",
  search: "",
  filterStatus: "All",
  modalClient: null,  // null=closed, {}=new, {id:...}=edit
};

// ─── GOOGLE SHEETS API ───────────────────────────────────────────────────────
async function sheetGet() {
  const res  = await fetch(SHEET_URL);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return (data.clients || []).map(normalize);
}
async function sheetSave(client) {
  await fetch(SHEET_URL, { method:"POST", body:JSON.stringify({ action:"save", client }) });
}
async function sheetBulkSave(clients) {
  await fetch(SHEET_URL, { method:"POST", body:JSON.stringify({ action:"bulkSave", clients }) });
}
function normalize(c) {
  return {
    ...c,
    id:             c.id || Date.now() + Math.random(),
    feeCharged:     Number(c.feeCharged)     || 0,
    amountReceived: Number(c.amountReceived) || 0,
    itrFiled:  c.itrFiled  === true || c.itrFiled  === "TRUE"  || c.itrFiled  === "true",
    feeWaived: c.feeWaived === true || c.feeWaived === "TRUE"  || c.feeWaived === "true",
    mobile:     c.mobile      || "",
    itrForm:    c.itrForm     || "",
    filingDate: c.filingDate  || "",
    paymentDate:c.paymentDate || "",
    paymentMode:c.paymentMode || "",
    remarks:    c.remarks     || "",
    status:     c.status      || "Pending",
    ay:         c.ay          || "AY 2026-27",
  };
}

async function loadData() {
  setSyncStatus("loading", "Loading from Google Sheets...");
  try {
    const data = await sheetGet();
    state.clients = data;
    try { localStorage.setItem("ca_ft_clients", JSON.stringify(data)); } catch(e){}
    setSyncStatus("ok", "Synced ✓  " + data.length + " clients loaded  (" + new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) + ")");
  } catch(err) {
    try {
      const saved = JSON.parse(localStorage.getItem("ca_ft_clients") || "[]");
      if (saved.length) { state.clients = saved.map(normalize); setSyncStatus("error", "Offline — showing cached data. Click ↻ to retry."); return; }
    } catch(e){}
    state.clients = [];
    setSyncStatus("error", "Could not connect to Google Sheets. Check internet. Click ↻ to retry.");
  } finally { render(); }
}

// ─── UTILITIES ───────────────────────────────────────────────────────────────
const fmt = n => "₹" + Number(n||0).toLocaleString("en-IN");
const today = () => new Date().toISOString().split("T")[0];
function calcStatus(fee, rcv, waived) {
  if (waived) return "Received";
  if (!rcv || rcv <= 0) return "Pending";
  if (rcv >= fee) return "Received";
  return "Partial";
}
function statusPill(status) {
  const sc = STATUS_COLORS[status] || STATUS_COLORS.Pending;
  return `<span class="status-pill" style="background:${sc.bg};color:${sc.text}"><span class="status-dot" style="background:${sc.dot}"></span>${status}</span>`;
}
function itrPill(filed) {
  return filed
    ? `<span class="itr-pill itr-filed">✓ Filed</span>`
    : `<span class="itr-pill itr-unfiled">⏳ Pending</span>`;
}

// ─── SYNC BAR ────────────────────────────────────────────────────────────────
function setSyncStatus(status, msg) {
  state.syncStatus = status; state.syncMsg = msg;
  const bar = document.getElementById("sync-bar");
  if (bar) {
    bar.className = "sync-bar " + status;
    bar.innerHTML = `<div class="sync-dot ${status}"></div><span>${msg}</span>
      ${status==="error" ? '<span class="sync-retry" onclick="loadData()">↻ Retry</span>' : ""}`;
  }
}

// ─── RENDER ENGINE ───────────────────────────────────────────────────────────
function render() {
  if (!state.role) { renderLogin(); return; }
  renderApp();
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function renderLogin() {
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").innerHTML = `
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-badge">CA TOOL</div>
        <div class="login-logo-title">Fee Tracker</div>
        <div class="login-logo-sub">Income Tax Filing Management</div>
      </div>
      <div class="login-role-tabs">
        <div class="role-tab active" id="tab-assoc" onclick="selectRole('associate')">
          <div class="role-tab-name">Associate</div>
          <div class="role-tab-desc">Data entry access</div>
        </div>
        <div class="role-tab" id="tab-ca" onclick="selectRole('ca')">
          <div class="role-tab-name">CA / Partner</div>
          <div class="role-tab-desc">Full access</div>
        </div>
      </div>
      <div id="ca-pass-field" style="display:none;margin-bottom:12px;">
        <input id="ca-password" class="form-input" type="password" placeholder="Enter CA password" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div id="login-error" class="login-error hidden"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Sign In →</button>
      <div class="login-hint" id="login-hint">Associates can sign in without a password</div>
    </div>
  </div>`;
  window._loginRole = "associate";
}
function selectRole(r) {
  window._loginRole = r;
  document.getElementById("tab-assoc").className = "role-tab" + (r==="associate"?" active":"");
  document.getElementById("tab-ca").className    = "role-tab" + (r==="ca"?" active":"");
  document.getElementById("ca-pass-field").style.display = r==="ca" ? "block" : "none";
  document.getElementById("login-hint").textContent = r==="ca" ? "Enter your CA password to continue" : "Associates can sign in without a password";
  document.getElementById("login-error").classList.add("hidden");
}
function doLogin() {
  const r = window._loginRole || "associate";
  if (r === "ca") {
    const pw = document.getElementById("ca-password").value;
    if (pw !== CA_PASSWORD) {
      const err = document.getElementById("login-error");
      err.textContent = "Incorrect password. Please try again.";
      err.classList.remove("hidden"); return;
    }
  }
  state.role = r; state.page = r === "ca" ? "dashboard" : "home";
  document.getElementById("login-screen").innerHTML = "";
  renderApp();
  loadData();
}

// ─── MAIN APP SHELL ──────────────────────────────────────────────────────────
function renderApp() {
  const app = document.getElementById("app");
  app.style.display = "flex";
  const isCA = state.role === "ca";
  const navItems = isCA
    ? [{id:"dashboard",label:"Dashboard",icon:"⊞"},{id:"clients",label:"All Clients",icon:"👥"},{id:"master",label:"Client Master",icon:"📋"},{id:"reports",label:"Reports",icon:"📄"},{id:"import",label:"Genius Import",icon:"🗄"}]
    : [{id:"home",label:"Home",icon:"⊞"},{id:"clients",label:"Client Records",icon:"👥"},{id:"master",label:"Client Master",icon:"📋"}];
  const titles = {home:"Associate Portal",dashboard:"CA Dashboard",clients:"Client Records",master:"Client Master",reports:"Reports & Analytics",import:"Genius Import"};
  const subs   = {home:"Data entry & management",dashboard:"Fee collection overview",clients:"All ITR filing & payment records",master:"Unique clients across all years",reports:"Financial summary",import:"Connect to Genius software"};

  const navHtml = navItems.map(n =>
    `<div class="nav-item${state.page===n.id?" active":""}" onclick="goPage('${n.id}')">${n.icon} ${n.label}</div>`
  ).join("");

  const ayOptions = AY_LIST.map(a => `<option${a===state.filterAY?" selected":""}>${a}</option>`).join("");

  app.innerHTML = `
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-badge">CA TOOL</div>
      <div class="brand-title">Fee Tracker</div>
      <div class="brand-sub">Income Tax Filing</div>
    </div>
    <nav class="sidebar-nav scrollbar-thin">
      <div class="nav-section">
        <div class="nav-section-label">Navigation</div>
        ${navHtml}
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Quick Action</div>
        <div class="nav-item" onclick="openModal(null)">⊕ Add Client</div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="role-badge">
        <div class="role-dot"></div>
        <div>
          <div class="role-name">${isCA ? "CA / Partner" : "Associate"}</div>
          <div class="role-label">${isCA ? "Full access" : "Data entry"}</div>
        </div>
      </div>
      <div class="backup-sidebar">
        <div class="backup-sidebar-title">💾 Data Backup</div>
        <button class="btn-backup-side" onclick="downloadBackup()">⬇ Save Backup File</button>
        <label style="display:block">
          <div class="btn-backup-side restore">⬆ Restore from Backup</div>
          <input type="file" accept=".json" onchange="restoreBackup(event)" style="display:none"/>
        </label>
      </div>
      <button class="btn-logout" onclick="signOut()">⬡ Sign Out</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">${titles[state.page]||""}</div>
        <div class="topbar-sub">${subs[state.page]||""}</div>
      </div>
      <div class="topbar-right">
        ${state.page !== "master" ? `
        <select class="filter-select" onchange="setAY(this.value)">${ayOptions}</select>
        <div class="ay-badge">${state.filterAY}</div>` : ""}
        <button class="btn btn-primary btn-sm" onclick="openModal(null)">⊕ New Entry</button>
      </div>
    </div>
    <div id="sync-bar" class="sync-bar ${state.syncStatus}">
      <div class="sync-dot ${state.syncStatus}"></div>
      <span>${state.syncMsg}</span>
    </div>
    <div class="content scrollbar-thin" id="page-content"></div>
  </main>`;

  renderPage();
  renderModal();
}

function goPage(p) { state.page = p; renderApp(); }
function setAY(ay) { state.filterAY = ay; renderApp(); }
function signOut() { state.role=null; state.page="home"; render(); }

// ─── PAGE ROUTER ─────────────────────────────────────────────────────────────
function renderPage() {
  const el = document.getElementById("page-content");
  if (!el) return;
  const isCA = state.role === "ca";
  const filtered = state.clients.filter(c => c.ay === state.filterAY);
  switch(state.page) {
    case "home":      el.innerHTML = renderAssocHome(); break;
    case "dashboard": el.innerHTML = renderCADashboard(filtered); break;
    case "clients":   el.innerHTML = renderClientsPage(); break;
    case "master":    el.innerHTML = renderMasterPage(); break;
    case "reports":   el.innerHTML = renderReports(filtered); break;
    case "import":    el.innerHTML = renderImport(); break;
    default:          el.innerHTML = "<p>Page not found</p>";
  }
  attachPageEvents();
}

// ─── ASSOCIATE HOME ───────────────────────────────────────────────────────────
function renderAssocHome() {
  const mine = state.clients.filter(c => c.ay === state.filterAY);
  const filed = mine.filter(c=>c.itrFiled).length;
  const unfiled = mine.filter(c=>!c.itrFiled).length;
  const pending = mine.filter(c=>c.status==="Pending").length;
  const partial = mine.filter(c=>c.status==="Partial").length;
  const received= mine.filter(c=>c.status==="Received").length;
  const itrPct  = mine.length ? Math.round(filed/mine.length*100) : 0;
  const feePct  = mine.length ? Math.round(received/mine.length*100) : 0;

  const unfiledRows = mine.filter(c=>!c.itrFiled).map((c,i)=>`
    <tr>
      <td style="font-size:12px;color:var(--text-3)">${i+1}</td>
      <td class="td-name">${c.name}</td>
      <td class="td-pan">${c.pan}</td>
      <td style="font-size:12px;color:var(--text-3)">${c.mobile||"—"}</td>
      <td style="font-size:11px;color:var(--text-3)">${c.ay}</td>
      <td>${itrPill(false)}</td>
      <td style="font-size:11px;color:var(--text-3)">${c.remarks||"—"}</td>
      <td><button class="btn btn-sm btn-outline" onclick="openModal(${JSON.stringify(c).replace(/"/g,"&quot;")})">✎</button></td>
    </tr>`).join("");

  return `<div class="fade-in">
    <div class="assoc-welcome">
      <div style="font-size:32px">👋</div>
      <div><h2>Welcome, Associate</h2><p>Add new clients, update payment details, and import client lists. Fee summaries are accessible to the CA only.</p></div>
    </div>
    <div class="assoc-stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="assoc-stat"><div class="assoc-stat-label">Total Clients</div><div class="assoc-stat-value">${mine.length}</div><div class="assoc-stat-sub">${state.filterAY}</div></div>
      <div class="assoc-stat" style="border-left:2px solid #9999ff"><div class="assoc-stat-label">ITR Filed</div><div class="assoc-stat-value" style="color:#9999ff">${filed}</div><div class="assoc-stat-sub">Returns submitted</div></div>
      <div class="assoc-stat" style="border-left:2px solid #5555ff"><div class="assoc-stat-label">Yet to File</div><div class="assoc-stat-value" style="color:#7777dd">${unfiled}</div><div class="assoc-stat-sub">Filing pending</div></div>
      <div class="assoc-stat" style="border-left:2px solid #ffaa00"><div class="assoc-stat-label">Payment Pending</div><div class="assoc-stat-value" style="color:#ffcc66">${pending}</div><div class="assoc-stat-sub">Needs update</div></div>
      <div class="assoc-stat" style="border-left:2px solid #ffcc00"><div class="assoc-stat-label">Partial Payment</div><div class="assoc-stat-value" style="color:#ffee99">${partial}</div><div class="assoc-stat-sub">Balance due</div></div>
      <div class="assoc-stat" style="border-left:2px solid #00cc66"><div class="assoc-stat-label">Fee Received</div><div class="assoc-stat-value" style="color:#66ffaa">${received}</div><div class="assoc-stat-sub">Payment complete</div></div>
    </div>
    <div class="filing-overview"><div class="filing-overview-title">📊 Progress Overview — ${state.filterAY}</div>
      <div class="filing-dual">
        <div>
          <div class="filing-bar-label"><span>ITR Filing Progress</span><strong>${filed} / ${mine.length} filed</strong></div>
          <div class="progress-bar-bg" style="height:8px"><div class="progress-itr" style="width:${itrPct}%"></div></div>
          <div class="filing-bar-sub">${itrPct}% filed · ${unfiled} yet to file</div>
        </div>
        <div>
          <div class="filing-bar-label"><span>Payment Collection</span><strong>${received} / ${mine.length} cleared</strong></div>
          <div class="progress-bar-bg" style="height:8px"><div class="progress-fee" style="width:${feePct}%"></div></div>
          <div class="filing-bar-sub">${feePct}% cleared · ${pending+partial} outstanding</div>
        </div>
      </div>
    </div>
    ${unfiled > 0 ? `<div class="section-heading">⏳ Clients Yet to File ITR (${unfiled})</div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Client Name</th><th>PAN</th><th>Mobile</th><th>AY</th><th>ITR Status</th><th>Remarks</th><th>Edit</th></tr></thead><tbody>${unfiledRows}</tbody></table></div>` : ""}
    <div class="db-panel" style="margin-top:20px">
      <div class="db-panel-title">📥 Import Client List</div>
      <div class="db-panel-sub">Upload a CSV file. Duplicate PANs are automatically skipped.</div>
      <div class="db-note"><strong>Required columns:</strong> name, pan &nbsp;·&nbsp; <strong>Optional:</strong> mobile, ay, itrform, filingdate, feecharged, feewaived</div>
      <label style="cursor:pointer;display:inline-block">
        <div class="btn btn-primary">⬆ Choose CSV File</div>
        <input type="file" accept=".csv" onchange="handleCSVImport(event)" style="display:none"/>
      </label>
      <div id="import-msg" style="margin-top:10px"></div>
    </div>
  </div>`;
}

// ─── CA DASHBOARD ─────────────────────────────────────────────────────────────
function renderCADashboard(clients) {
  const billable  = clients.filter(c=>!c.feeWaived);
  const billed    = billable.reduce((s,c)=>s+c.feeCharged,0);
  const received  = billable.reduce((s,c)=>s+c.amountReceived,0);
  const itrFiled  = clients.filter(c=>c.itrFiled).length;
  const itrUnfiled= clients.filter(c=>!c.itrFiled).length;
  const pct       = billed > 0 ? Math.round(received/billed*100) : 0;
  const itrPct    = clients.length > 0 ? Math.round(itrFiled/clients.length*100) : 0;
  const waived    = clients.filter(c=>c.feeWaived).length;
  const urgent    = clients.filter(c=>c.status!=="Received"&&!c.feeWaived)
                    .sort((a,b)=>(b.feeCharged-b.amountReceived)-(a.feeCharged-a.amountReceived)).slice(0,10);

  const urgentRows = urgent.map(c => {
    const bal=c.feeCharged-c.amountReceived;
    return `<tr>
      <td class="td-name">${c.name}</td>
      <td class="td-pan">${c.pan}</td>
      <td style="font-size:12px;color:var(--text-3)">${c.mobile||"—"}</td>
      <td>${itrPill(c.itrFiled)}</td>
      <td class="td-amount">${fmt(c.feeCharged)}</td>
      <td class="td-amount" style="color:#66ffaa">${fmt(c.amountReceived)}</td>
      <td class="td-amount" style="color:#ff7b7b">${fmt(bal)}</td>
      <td>${statusPill(c.status)}</td>
      <td><button class="btn btn-sm btn-outline" onclick="openModal(${JSON.stringify(c).replace(/"/g,"&quot;")})">✎</button></td>
    </tr>`;}).join("");

  return `<div class="fade-in">
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card gold"><div class="stat-label">Total Clients</div><div class="stat-value">${clients.length}</div><div class="stat-sub">${state.filterAY}</div><div class="stat-icon" style="font-size:40px;opacity:.1">👥</div></div>
      <div class="stat-card" style="border-top:none"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#9999ff,transparent)"></div><div class="stat-label">ITR Filed</div><div class="stat-value" style="color:#9999ff">${itrFiled}</div><div class="stat-sub">Click to see list</div></div>
      <div class="stat-card" style="border-top:none"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#5555ff,transparent)"></div><div class="stat-label">Yet to File</div><div class="stat-value" style="color:#7777dd">${itrUnfiled}</div><div class="stat-sub">Click to see list</div></div>
      <div class="stat-card green"><div class="stat-label">Fees Collected</div><div class="stat-value" style="font-size:20px">${fmt(received)}</div><div class="stat-sub">${pct}% of total billed</div><div class="stat-icon" style="font-size:40px;opacity:.1">₹</div></div>
      <div class="stat-card" style="border-top:none;position:relative"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#ff4444,transparent)"></div><div class="stat-label">🔴 Filed — Fee Pending</div><div class="stat-value" style="font-size:20px;color:#ff7b7b">${fmt(billable.filter(c=>c.itrFiled&&c.status!=="Received").reduce((s,c)=>s+c.feeCharged-c.amountReceived,0))}</div><div class="stat-sub" style="color:#ff9999">${billable.filter(c=>c.itrFiled&&c.status!=="Received").length} clients — urgent</div></div>
      <div class="stat-card" style="border-top:none;position:relative"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#ffaa00,transparent)"></div><div class="stat-label">🟡 Not Filed — Fee Pending</div><div class="stat-value" style="font-size:20px;color:#ffcc66">${fmt(billable.filter(c=>!c.itrFiled&&c.status!=="Received").reduce((s,c)=>s+c.feeCharged-c.amountReceived,0))}</div><div class="stat-sub" style="color:#ffdd88">${billable.filter(c=>!c.itrFiled&&c.status!=="Received").length} clients — expected</div></div>

        <div>

          <div class="progress-bar-bg" style="height:8px"><div class="progress-itr" style="width:${itrPct}%"></div></div>
          <div class="filing-bar-sub">${itrPct}% filed · ${itrUnfiled} yet to file</div>
        </div>
        <div>
          <div class="filing-bar-label"><span>Fee Collection</span><strong>${fmt(received)} / ${fmt(billed)}</strong></div>
          <div class="progress-bar-bg" style="height:8px"><div class="progress-fee" style="width:${pct}%"></div></div>
          <div class="filing-bar-sub">${pct}% collected · Balance ${fmt(billed-received)}</div>
        </div>
      </div>
    </div>
    <div style="margin:16px 0 8px;font-size:12px;color:var(--text-3)">⚠ Top Outstanding Payments</div>

      <thead><tr><th>Client Name</th><th>PAN</th><th>Mobile</th><th>ITR</th><th>Fee</th><th>Received</th><th>Balance</th><th>Status</th><th>Edit</th></tr></thead>
      <tbody>${urgent.length ? urgentRows : '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-3)">🎉 All fees collected!</td></tr>'}</tbody>

}

// ─── CLIENTS PAGE ─────────────────────────────────────────────────────────────
function renderClientsPage() {
  const isCA = state.role === "ca";
  const q    = state.search.toLowerCase();
  let list   = state.clients.filter(c => {
    const ayOk = state.filterAY === "All" || c.ay === state.filterAY;
    const stOk = state.filterStatus === "All" || c.status === state.filterStatus;
    const srOk = !q || c.name.toLowerCase().includes(q) || c.pan.toLowerCase().includes(q) || (c.mobile||"").includes(q);
    return ayOk && stOk && srOk;
  });

  const rows = list.map((c,i) => {
    const bal = c.feeCharged - c.amountReceived;
    return `<tr class="${c.feeWaived?"waived-row":""}">
      <td style="font-size:12px;color:var(--text-3)">${i+1}</td>
      <td class="td-name">${c.name}${c.feeWaived?'<span class="waived-pill" style="margin-left:6px;font-size:10px">🎁</span>':""}</td>
      <td class="td-pan">${c.pan}</td>
      <td style="font-size:12px;color:var(--text-3)">${c.mobile||"—"}</td>
      <td style="font-size:11px;color:var(--text-3)">${c.ay}</td>
      <td>${itrPill(c.itrFiled)}</td>
      <td><span style="font-size:11px;padding:2px 8px;background:var(--navy-3);border-radius:4px">${c.itrForm||"—"}</span></td>
      <td style="font-size:12px;color:var(--text-3)">${c.filingDate||"—"}</td>
      <td class="td-amount">${isCA ? (c.feeWaived?"<span class='waived-pill'>🎁</span>":fmt(c.feeCharged)) : "—"}</td>
      <td class="td-amount" style="color:#66ffaa">${isCA ? (c.feeWaived?"—":fmt(c.amountReceived)) : "—"}</td>
      <td class="td-amount" style="color:${bal>0&&!c.feeWaived?"#ff7b7b":"#66ffaa"}">${isCA ? (c.feeWaived?"—":fmt(bal)) : "—"}</td>
      <td>${statusPill(c.status)}</td>
      <td><button class="btn btn-sm btn-outline" onclick="openModal(${JSON.stringify(c).replace(/"/g,"&quot;")})">✎</button></td>
    </tr>`;}).join("");

  const statusOpts = ["All","Pending","Partial","Received"].map(s =>
    `<option${s===state.filterStatus?" selected":""}>${s}</option>`).join("");

  return `<div class="fade-in">
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <input class="form-input" style="flex:1;min-width:180px;margin:0" placeholder="Search name, PAN, mobile..." id="client-search" value="${state.search}" oninput="state.search=this.value;renderPage()"/>
      <select class="filter-select" onchange="state.filterStatus=this.value;renderPage()">${statusOpts}</select>
      <label style="cursor:pointer">
        <div class="btn btn-outline btn-sm">⬆ Import CSV</div>
        <input type="file" accept=".csv" onchange="handleCSVImport(event)" style="display:none"/>
      </label>
      <span style="font-size:11px;color:var(--text-3)">${list.length} records</span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Client Name</th><th>PAN</th><th>Mobile</th><th>AY</th><th>ITR Status</th><th>Form</th><th>Filed On</th><th>Fee</th><th>Received</th><th>Balance</th><th>Status</th><th>Edit</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="13" style="text-align:center;padding:30px;color:var(--text-3)">No records found</td></tr>'}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--text-3);margin-top:8px;text-align:right">${list.length} of ${state.clients.length} total records</div>
  </div>`;
}

// ─── CLIENT MASTER ────────────────────────────────────────────────────────────
function renderMasterPage() {
  const isCA = state.role === "ca";
  const masterMap = {};
  state.clients.forEach(c => {
    const pan = c.pan.toUpperCase();
    if (!masterMap[pan]) masterMap[pan] = { pan, name:c.name, mobile:c.mobile, filings:[] };
    if (c.name) masterMap[pan].name = c.name;
    if (c.mobile) masterMap[pan].mobile = c.mobile;
    masterMap[pan].filings.push(c);
  });
  Object.values(masterMap).forEach(m => m.filings.sort((a,b)=>b.ay.localeCompare(a.ay)));
  const list = Object.values(masterMap).sort((a,b)=>a.name.localeCompare(b.name));
  const multiYear = list.filter(m=>m.filings.length>1).length;
  const allAYs = [...new Set(state.clients.map(c=>c.ay))].sort((a,b)=>b.localeCompare(a));

  const cards = list.map(m => {
    const totalFee = m.filings.filter(f=>!f.feeWaived).reduce((s,f)=>s+f.feeCharged,0);
    const totalRcv = m.filings.filter(f=>!f.feeWaived).reduce((s,f)=>s+f.amountReceived,0);
    const outstanding = totalFee - totalRcv;
    const ayChips = m.filings.map(f=>`<span class="master-ay-chip">${f.ay.replace("AY ","")}</span>`).join("");
    return `<div class="master-card">
      <div class="master-card-header">
        <div><div class="master-card-name">${m.name}</div><div class="master-card-pan">${m.pan}</div></div>
        <div class="master-card-mobile">${m.mobile||"—"}</div>
        <div class="master-card-meta">${ayChips}</div>
        ${isCA ? `<div style="text-align:right"><div style="font-size:11px;color:var(--text-3)">${m.filings.length} filing(s)</div>${outstanding>0?`<div style="font-size:12px;color:#ff9999;font-family:'DM Mono',monospace">${fmt(outstanding)} due</div>`:'<div style="font-size:12px;color:#66ffaa">✓ Clear</div>'}</div>` : ""}
      </div>
    </div>`;}).join("");

  return `<div class="fade-in">
    <div class="master-stats-bar">
      <div class="master-stat"><div class="master-stat-label">Unique Clients</div><div class="master-stat-value">${list.length}</div><div class="master-stat-sub">Across all years</div></div>
      <div class="master-stat"><div class="master-stat-label">Total Filings</div><div class="master-stat-value">${state.clients.length}</div><div class="master-stat-sub">${allAYs.length} AY(s)</div></div>
      <div class="master-stat" style="border-left:2px solid var(--gold-dim)"><div class="master-stat-label">Multi-Year</div><div class="master-stat-value" style="color:var(--gold-light)">${multiYear}</div><div class="master-stat-sub">Filed 2+ years</div></div>
      <div class="master-stat" style="border-left:2px solid #9999ff"><div class="master-stat-label">New This Year</div><div class="master-stat-value" style="color:#9999ff">${list.filter(m=>m.filings.length===1&&allAYs[0]&&m.filings[0].ay===allAYs[0]).length}</div><div class="master-stat-sub">${allAYs[0]||"—"}</div></div>
    </div>
    <div class="master-search-bar">
      <input class="form-input" style="flex:1;min-width:200px;margin:0" placeholder="Search name, PAN or mobile..."/>
      <span class="master-count-badge">${list.length} clients</span>
    </div>
    ${cards||'<div class="master-empty">📋<br>No clients yet</div>'}
  </div>`;
}

// ─── REPORTS ──────────────────────────────────────────────────────────────────
function renderReports(clients) {
  const billable = clients.filter(c=>!c.feeWaived);
  const billed   = billable.reduce((s,c)=>s+c.feeCharged,0);
  const received = billable.reduce((s,c)=>s+c.amountReceived,0);
  const pendingFiled   = billable.filter(c=>c.itrFiled  && c.status!=="Received").sort((a,b)=>(b.feeCharged-b.amountReceived)-(a.feeCharged-a.amountReceived));
  const pendingUnfiled = billable.filter(c=>!c.itrFiled && c.status!=="Received").sort((a,b)=>(b.feeCharged-b.amountReceived)-(a.feeCharged-a.amountReceived));
  const pending = [...pendingFiled, ...pendingUnfiled];
  const byMode   = PAY_MODES.map(m=>{ const g=clients.filter(c=>c.paymentMode===m); return {mode:m,count:g.length,rcv:g.reduce((s,c)=>s+c.amountReceived,0)}; }).filter(x=>x.count>0);

  // pendingRows replaced by inline makeRows in template

  const modeCards = byMode.map(r=>`<div style="background:var(--navy-3);border-radius:var(--radius);padding:12px 14px"><div style="font-size:11px;color:var(--text-3);margin-bottom:4px">${r.mode}</div><div style="font-size:14px;font-family:'DM Mono',monospace;color:#66ffaa">${fmt(r.rcv)}</div><div style="font-size:11px;color:var(--text-3);margin-top:2px">${r.count} payment(s)</div></div>`).join("");

  return `<div class="fade-in">
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
      <button class="btn btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
    </div>
    <div class="report-grid">
      <div class="report-card">
        <div class="report-card-title">₹ Fee Summary</div>
        ${[["Total Billed",fmt(billed),"var(--text-1)"],["Total Received",fmt(received),"#66ffaa"],["Outstanding",fmt(billed-received),"#ff7b7b"],["Collection %",billed>0?Math.round(received/billed*100)+"%":"0%","var(--gold-light)"]].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-2)"><span style="font-size:12px;color:var(--text-3)">${l}</span><span style="font-size:13px;font-family:'DM Mono',monospace;color:${c}">${v}</span></div>`).join("")}
      </div>
      <div class="report-card">
        <div class="report-card-title">👥 By Status</div>
        ${["Pending","Partial","Received"].map(s=>{ const sc=STATUS_COLORS[s]; const g=billable.filter(c=>c.status===s); return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-2)">${statusPill(s)}<span style="font-size:12px;color:var(--text-3)">${g.length} clients</span><span style="font-size:13px;font-family:'DM Mono',monospace;color:var(--text-2)">${fmt(g.reduce((s,c)=>s+c.feeCharged,0))}</span></div>`; }).join("")}
      </div>
      <div class="report-card" style="grid-column:1/-1">
        <div class="report-card-title">₹ By Payment Mode</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${modeCards||'<span style="font-size:12px;color:var(--text-3)">No payments recorded</span>'}</div>
      </div>
    </div>
    ${(()=>{
      const sc2 = (st) => { const s=STATUS_COLORS[st]||STATUS_COLORS.Pending; return s; };
      const fmtRow = (c,i) => {
        const bal = c.feeCharged - c.amountReceived;
        const sc  = sc2(c.status);
        const pill= '<span class="status-pill" style="background:'+sc.bg+';color:'+sc.text+'">'+
                    '<span class="status-dot" style="background:'+sc.dot+'">&#8203;</span>'+c.status+'</span>';
        return '<tr>'+
          '<td style="font-size:12px;color:var(--text-3)">'+(i+1)+'</td>'+
          '<td class="td-name">'+c.name+'</td>'+
          '<td class="td-pan">'+c.pan+'</td>'+
          '<td style="font-size:12px;color:var(--text-3)">'+(c.mobile||'&#8212;')+'</td>'+
          '<td style="font-size:11px;color:var(--text-3)">'+c.ay+'</td>'+
          '<td class="td-amount">'+fmt(c.feeCharged)+'</td>'+
          '<td class="td-amount" style="color:#66ffaa">'+fmt(c.amountReceived)+'</td>'+
          '<td class="td-amount" style="color:#ff7b7b">'+fmt(bal)+'</td>'+
          '<td>'+pill+'</td>'+
          '<td style="font-size:11px;color:var(--text-3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(c.remarks||'&#8212;')+'</td>'+
          '</tr>';
      };
      const thead = '<thead><tr><th>#</th><th>Name</th><th>PAN</th><th>Mobile</th><th>AY</th><th>Fee</th><th>Received</th><th>Balance</th><th>Status</th><th>Remarks</th></tr></thead>';
      const filedAmt   = pendingFiled.reduce((s,c)=>s+c.feeCharged-c.amountReceived,0);
      const unfiledAmt = pendingUnfiled.reduce((s,c)=>s+c.feeCharged-c.amountReceived,0);
      const noFiled   = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--text-3)">No pending fees for filed returns!</td></tr>';
      const noUnfiled = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--text-3)">No pending fees for unfiled returns!</td></tr>';
      const filedRows   = pendingFiled.length   ? pendingFiled.map(fmtRow).join('')   : noFiled;
      const unfiledRows = pendingUnfiled.length ? pendingUnfiled.map(fmtRow).join('') : noUnfiled;
      return (
        '<div style="margin:16px 0 8px;display:flex;align-items:center;gap:10px">'+
          '<span style="font-size:13px;font-weight:600;color:#ff7b7b">ITR Filed &#8212; Fee Pending ('+pendingFiled.length+' clients &middot; '+fmt(filedAmt)+')</span>'+
          '<span style="font-size:10px;background:rgba(255,68,68,0.1);color:#ff9999;padding:2px 8px;border-radius:4px">ACTION NEEDED</span>'+
        '</div>'+
        '<div class="table-wrap"><table>'+thead+'<tbody>'+filedRows+'</tbody></table></div>'+
        '<div style="margin:20px 0 8px;display:flex;align-items:center;gap:10px">'+
          '<span style="font-size:13px;font-weight:600;color:#ffcc66">ITR Not Filed &#8212; Fee Pending ('+pendingUnfiled.length+' clients &middot; '+fmt(unfiledAmt)+')</span>'+
          '<span style="font-size:10px;background:rgba(255,170,0,0.1);color:#ffdd88;padding:2px 8px;border-radius:4px">EXPECTED</span>'+
        '</div>'+
        '<div class="table-wrap"><table>'+thead+'<tbody>'+unfiledRows+'</tbody></table></div>'
      );
    })()}
  </div>`;
}

// ─── CLIENT MODAL ─────────────────────────────────────────────────────────────
function openModal(clientData) {
  if (typeof clientData === "string") {
    try { state.modalClient = JSON.parse(clientData.replace(/&quot;/g, '"')); }
    catch(e) { state.modalClient = {}; }
  } else {
    state.modalClient = clientData || {};
  }
  renderModal();
}
function closeModal() { state.modalClient = null; document.getElementById("modal-wrap").innerHTML = ""; }

function renderModal() {
  const wrap = document.getElementById("modal-wrap");
  if (!wrap) {
    const w = document.createElement("div"); w.id="modal-wrap"; document.body.appendChild(w);
  }
  const mw = document.getElementById("modal-wrap");
  if (state.modalClient === null) { mw.innerHTML = ""; return; }
  const c = state.modalClient;
  const isNew = !c.id;
  const v = f => c[f] !== undefined ? c[f] : "";

  const ayOpts  = AY_LIST.map(a=>`<option${(v("ay")||"AY 2026-27")===a?" selected":""}>${a}</option>`).join("");
  const formOpts= ['<option value="">— Not specified —</option>',...ITR_FORMS.map(f=>`<option${v("itrForm")===f?" selected":""}>${f}</option>`)].join("");
  const modeOpts= ['<option value="">— Select —</option>',...PAY_MODES.map(m=>`<option${v("paymentMode")===m?" selected":""}>${m}</option>`)].join("");

  mw.innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal fade-in" style="max-width:600px;width:100%">
      <div class="modal-header">
        <div class="modal-title">${isNew?"New Client Entry":"Edit Client"}</div>
        <button class="btn-icon" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-section-label">Client Details</div>
          <div class="form-group"><label class="form-label">Client Name *</label><input class="form-input" id="f-name" value="${v("name")}" placeholder="Full name as per PAN"/></div>
          <div class="form-group"><label class="form-label">PAN Number *</label><input class="form-input" id="f-pan" value="${v("pan")}" placeholder="ABCDE1234F" style="text-transform:uppercase"/></div>
          <div class="form-group"><label class="form-label">Mobile <span class="opt-tag">optional</span></label><input class="form-input" id="f-mobile" value="${v("mobile")}" placeholder="10-digit mobile"/></div>
          <div class="form-group"><label class="form-label">Assessment Year</label><select class="form-select" id="f-ay">${ayOpts}</select></div>
          <div class="form-section-label">ITR Filing</div>
          <div class="form-group"><label class="form-label">ITR Filing Status</label>
            <div style="display:flex;gap:8px">
              <div onclick="document.getElementById('f-itrFiled').value='true';this.style.background='rgba(201,168,76,0.12)';this.style.borderColor='var(--gold-dim)';this.style.color='var(--gold-light)';this.nextElementSibling.style.background='var(--navy-3)';this.nextElementSibling.style.borderColor='var(--border)';this.nextElementSibling.style.color='var(--text-3)'"
                style="flex:1;padding:9px 12px;border-radius:var(--radius);border:1px solid ${v("itrFiled")?"var(--gold-dim)":"var(--border)"};background:${v("itrFiled")?"rgba(201,168,76,0.12)":"var(--navy-3)"};color:${v("itrFiled")?"var(--gold-light)":"var(--text-3)"};font-size:12px;font-weight:500;cursor:pointer;text-align:center">✓ Filed</div>
              <div onclick="document.getElementById('f-itrFiled').value='false';this.style.background='rgba(201,168,76,0.12)';this.style.borderColor='var(--gold-dim)';this.style.color='var(--gold-light)';this.previousElementSibling.style.background='var(--navy-3)';this.previousElementSibling.style.borderColor='var(--border)';this.previousElementSibling.style.color='var(--text-3)'"
                style="flex:1;padding:9px 12px;border-radius:var(--radius);border:1px solid ${!v("itrFiled")?"var(--gold-dim)":"var(--border)"};background:${!v("itrFiled")?"rgba(201,168,76,0.12)":"var(--navy-3)"};color:${!v("itrFiled")?"var(--gold-light)":"var(--text-3)"};font-size:12px;font-weight:500;cursor:pointer;text-align:center">⏳ Yet to File</div>
            </div>
            <input type="hidden" id="f-itrFiled" value="${v("itrFiled")??"false"}"/>

          <div class="form-group"><label class="form-label">ITR Form <span class="opt-tag">optional</span></label><select class="form-select" id="f-itrForm">${formOpts}</select></div>
          <div class="form-group"><label class="form-label">Filing Date <span class="opt-tag">if filed</span></label><input class="form-input" id="f-filingDate" type="date" value="${v("filingDate")}"/></div>
          <div class="form-section-label">💰 Fee & Payment</div>

            <div style="display:flex;gap:8px">
              <div id="waive-no" onclick="setWaived(false)" style="flex:1;padding:9px 14px;border-radius:var(--radius);border:1px solid ${!v("feeWaived")?"var(--gold-dim)":"var(--border)"};background:${!v("feeWaived")?"rgba(201,168,76,0.12)":"var(--navy-3)"};color:${!v("feeWaived")?"var(--gold-light)":"var(--text-3)"};font-size:12px;font-weight:500;cursor:pointer;text-align:center">No — Fee applicable</div>
              <div id="waive-yes" onclick="setWaived(true)" style="flex:1;padding:9px 14px;border-radius:var(--radius);border:1px solid ${v("feeWaived")?"#446644":"var(--border)"};background:${v("feeWaived")?"rgba(68,102,68,0.25)":"var(--navy-3)"};color:${v("feeWaived")?"#88cc88":"var(--text-3)"};font-size:12px;font-weight:500;cursor:pointer;text-align:center">🎁 Yes — Waived</div>
            </div>
            <input type="hidden" id="f-feeWaived" value="${v("feeWaived")??"false"}"/>
          </div>
          <div class="form-group"><label class="form-label">Fee Charged (₹)</label><input class="form-input" id="f-feeCharged" type="number" value="${v("feeCharged")||""}" placeholder="0" ${v("feeWaived")?"disabled style='opacity:0.4'":""}/></div>
          <div class="form-group"><label class="form-label">Amount Received (₹)</label><input class="form-input" id="f-amtRcv" type="number" value="${v("amountReceived")||""}" placeholder="0" ${v("feeWaived")?"disabled style='opacity:0.4'":""}/></div>
          <div class="form-group"><label class="form-label">Payment Date</label><input class="form-input" id="f-payDate" type="date" value="${v("paymentDate")}"/></div>
          <div class="form-group"><label class="form-label">Payment Mode</label><select class="form-select" id="f-payMode">${modeOpts}</select></div>
          <div class="form-group" style="grid-column:1/-1"><label class="form-label">Remarks <span class="opt-tag">optional</span></label><textarea class="form-textarea" id="f-remarks" placeholder="Notes about payment...">${v("remarks")}</textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <div id="form-balance" style="font-size:12px;color:var(--text-3)"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveModalClient()">💾 Save</button>
        </div>
      </div>
    </div>
  </div>`;
}

function setWaived(val) {
  document.getElementById("f-feeWaived").value = val;
  const feeInput = document.getElementById("f-feeCharged");
  const amtInput = document.getElementById("f-amtRcv");
  if (feeInput) { feeInput.disabled = val; feeInput.style.opacity = val ? "0.4" : "1"; }
  if (amtInput) { amtInput.disabled = val; amtInput.style.opacity = val ? "0.4" : "1"; }
  document.getElementById("waive-no").style.background  = !val ? "rgba(201,168,76,0.12)" : "var(--navy-3)";
  document.getElementById("waive-no").style.borderColor = !val ? "var(--gold-dim)" : "var(--border)";
  document.getElementById("waive-no").style.color       = !val ? "var(--gold-light)" : "var(--text-3)";
  document.getElementById("waive-yes").style.background  = val ? "rgba(68,102,68,0.25)" : "var(--navy-3)";
  document.getElementById("waive-yes").style.borderColor = val ? "#446644" : "var(--border)";
  document.getElementById("waive-yes").style.color       = val ? "#88cc88" : "var(--text-3)";
}

async function saveModalClient() {
  const name = document.getElementById("f-name").value.trim();
  const pan  = document.getElementById("f-pan").value.trim().toUpperCase();
  if (!name || !pan) { alert("Client name and PAN are required."); return; }

  const waived = document.getElementById("f-feeWaived").value === "true";
  const fee    = waived ? 0 : parseFloat(document.getElementById("f-feeCharged").value)||0;
  const amt    = waived ? 0 : parseFloat(document.getElementById("f-amtRcv").value)||0;

  const client = {
    id:             state.modalClient.id || Date.now(),
    pan, name,
    mobile:         document.getElementById("f-mobile").value.trim(),
    ay:             document.getElementById("f-ay").value,
    itrFiled:       document.getElementById("f-itrFiled").value === "true",
    itrForm:        document.getElementById("f-itrForm").value,
    filingDate:     document.getElementById("f-filingDate").value,
    feeWaived:      waived,
    feeCharged:     fee,
    amountReceived: amt,
    paymentDate:    document.getElementById("f-payDate").value,
    paymentMode:    document.getElementById("f-payMode").value,
    status:         calcStatus(fee, amt, waived),
    remarks:        document.getElementById("f-remarks").value.trim(),
  };

  // Update local state immediately
  const idx = state.clients.findIndex(x=>x.id===client.id);
  if (idx >= 0) state.clients[idx] = client;
  else state.clients.push(client);

  closeModal();
  renderApp();
  setSyncStatus("syncing", "Saving to Google Sheets...");
  try {
    await sheetSave(client);
    setSyncStatus("ok", "Saved ✓  " + new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}));
    try { localStorage.setItem("ca_ft_clients", JSON.stringify(state.clients)); } catch(e){}
  } catch(err) {
    setSyncStatus("error", "Saved locally — could not sync to Google Sheets. Click ↻ to retry.");
  }
}

// ─── CSV IMPORT ───────────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const result=[]; let cur=""; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===","&&!inQ){result.push(cur.trim());cur="";}
    else{cur+=ch;}
  }
  result.push(cur.trim()); return result;
}

async function handleCSVImport(event) {
  const file = event.target.files[0]; if (!file) return;
  const text = await file.text();
  const clean = text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines = clean.split("\n").filter(l=>l.trim());
  if (lines.length < 2) { showImportMsg(false,"File is empty or has no data rows."); return; }

  const headers = parseCSVLine(lines[0]).map(h=>h.toLowerCase().replace(/[\s_\-]/g,""));
  const existing = new Set(state.clients.map(c=>c.pan.toUpperCase()));
  const imported=[]; let skipped=0;

  lines.slice(1).forEach((line,idx)=>{
    const cols = parseCSVLine(line);
    const get  = (...keys) => { for(const k of keys){ const i=headers.indexOf(k); if(i>=0) return (cols[i]||"").trim(); } return ""; };
    const pan  = get("pan","pannumber").toUpperCase();
    const name = get("name","clientname","fullname");
    if (!name || existing.has(pan)) { if(name) skipped++; return; }
    const fee = parseFloat(get("feecharged","fee","fees")||0);
    const waived = ["yes","true","1","waived"].includes(get("feewaived","waived").toLowerCase());
    imported.push(normalize({
      id: Date.now()+idx+Math.random(), pan, name,
      mobile:     get("mobile","mobileno","phone"),
      itrForm:    get("itrform","form","itr"),
      ay:         get("ay","assessmentyear") || state.filterAY,
      itrFiled:   ["yes","true","1","filed"].includes(get("itrfiled","filed","itrstatus").toLowerCase()),
      filingDate: get("filingdate","dateoffiling","date"),
      feeWaived:  waived, feeCharged: waived?0:fee,
      amountReceived:0, paymentDate:"", paymentMode:"",
      status:"Pending", remarks:"",
    }));
    existing.add(pan);
  });

  if (imported.length === 0) { showImportMsg(false,"No new records found. "+skipped+" duplicate(s) skipped."); return; }
  state.clients.push(...imported);
  renderApp();
  showImportMsg(true,"✅ Imported "+imported.length+" client(s). "+skipped+" duplicate(s) skipped.");
  setSyncStatus("syncing","Uploading "+imported.length+" clients to Google Sheets...");
  try {
    await sheetBulkSave(imported);
    setSyncStatus("ok","Imported "+imported.length+" clients ✓");
    try { localStorage.setItem("ca_ft_clients",JSON.stringify(state.clients)); } catch(e){}
  } catch(err) {
    setSyncStatus("error","Imported locally — could not sync to Google Sheets.");
  }
  event.target.value="";
}

function showImportMsg(ok, text) {
  const el = document.getElementById("import-msg");
  if (el) el.innerHTML = `<div class="${ok?"import-msg-ok":"import-msg-err"}">${text}</div>`;
}

// ─── CSV EXPORT ───────────────────────────────────────────────────────────────
function exportCSV() {
  const rows=[["PAN","Name","Mobile","AY","ITR Form","ITR Filed","Filing Date","Fee Waived","Fee Charged","Received","Balance","Payment Mode","Status","Remarks"]];
  state.clients.forEach(c=>rows.push([c.pan,c.name,c.mobile||"",c.ay,c.itrForm||"",c.itrFiled?"Yes":"No",c.filingDate||"",c.feeWaived?"Yes":"No",c.feeWaived?"Waived":c.feeCharged,c.feeWaived?"Waived":c.amountReceived,c.feeWaived?"Waived":(c.feeCharged-c.amountReceived),c.paymentMode||"",c.status,c.remarks||""]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,"")+'"').join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.setAttribute("download","CA_FeeTracker_Export.csv");
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ─── BACKUP ───────────────────────────────────────────────────────────────────
function downloadBackup() {
  const payload={version:1,exportedAt:new Date().toISOString(),clients:state.clients};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  a.setAttribute("download","CA_FeeTracker_Backup_"+new Date().toISOString().slice(0,10)+".json");
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
async function restoreBackup(event) {
  const file=event.target.files[0]; if(!file) return;
  const text=await file.text();
  try {
    const parsed=JSON.parse(text);
    const data=(parsed.clients||parsed).map(normalize);
    if(!data.length){alert("No client data found in backup.");return;}
    if(confirm("Restore "+data.length+" clients? This will replace ALL current data.")) {
      state.clients=data; renderApp();
      setSyncStatus("syncing","Uploading restored data to Google Sheets...");
      try { await sheetBulkSave(data); setSyncStatus("ok","Restored "+data.length+" clients ✓"); } catch(e){ setSyncStatus("error","Restored locally — could not sync to Sheets."); }
    }
  } catch(e){ alert("Invalid backup file."); }
  event.target.value="";
}

// ─── PAGE EVENTS (re-attach after innerHTML) ──────────────────────────────────
function attachPageEvents() {
  // nothing needed — events use global functions via onclick
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
render();
</script>
